<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a191f" />
      <stop offset="70%" stop-color="#050e13" />
      <stop offset="100%" stop-color="#020608" />
    </radialGradient>

    <!-- Celestial Gold Ring Gradient -->
    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2a8" />
      <stop offset="30%" stop-color="#d4af37" />
      <stop offset="70%" stop-color="#aa841c" />
      <stop offset="100%" stop-color="#fdf3b0" />
    </linearGradient>

    <!-- Central Keystone Core Gradient (Emerald Life & Solar Spark) -->
    <linearGradient id="coreGem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#80ffea" />
      <stop offset="35%" stop-color="#10b981" />
      <stop offset="70%" stop-color="#059669" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Inner Glow -->
    <radialGradient id="innerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#10b981" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0" />
    </radialGradient>

    <!-- Star Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circular Base Shield -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)" stroke="url(#goldRing)" stroke-width="1.5" />
  
  <!-- Subtle Leyline Aura Glow -->
  <circle cx="32" cy="32" r="22" fill="url(#innerGlow)" />

  <!-- Outer Runic Ring (6 Elemental Nodes for the Six Realms) -->
  <circle cx="32" cy="32" r="24" fill="none" stroke="url(#goldRing)" stroke-width="0.8" stroke-dasharray="3, 3" opacity="0.75" />

  <!-- 6 Realm Anchor Dots -->
  <!-- Top: Lumina (0 deg) -->
  <circle cx="32" cy="8" r="2" fill="#ffd700" filter="url(#glow)" />
  <!-- Top Right: Aerisia (60 deg) -->
  <circle cx="52.8" cy="20" r="1.8" fill="#67e8f9" />
  <!-- Bottom Right: Sylvanis (120 deg) -->
  <circle cx="52.8" cy="44" r="1.8" fill="#34d399" />
  <!-- Bottom: Umbralis (180 deg) -->
  <circle cx="32" cy="56" r="1.8" fill="#c084fc" />
  <!-- Bottom Left: Aethelgard (240 deg) -->
  <circle cx="11.2" cy="44" r="1.8" fill="#f97316" />
  <!-- Top Left: Kryosia (300 deg) -->
  <circle cx="11.2" cy="20" r="1.8" fill="#93c5fd" />

  <!-- The Six-Rayed Celestial Spark & Keystone Diamond -->
  <!-- Radiating Prismatic Star Rays -->
  <path d="M32 10 L34.5 27 L51.5 32 L34.5 37 L32 54 L29.5 37 L12.5 32 L29.5 27 Z" 
        fill="url(#goldRing)" opacity="0.9" />

  <!-- Central Hexagonal Keystone Gem -->
  <polygon points="32,18 44,25 44,39 32,46 20,39 20,25" 
           fill="url(#coreGem)" stroke="url(#goldRing)" stroke-width="1.2" filter="url(#glow)" />

  <!-- Inner Facets of the Keystone -->
  <polygon points="32,18 44,25 32,32 20,25" fill="#a7f3d0" opacity="0.6" />
  <polygon points="44,25 44,39 32,32" fill="#059669" opacity="0.7" />
  <polygon points="44,39 32,46 32,32" fill="#047857" opacity="0.8" />
  <polygon points="32,46 20,39 32,32" fill="#b45309" opacity="0.6" />
  <polygon points="20,39 20,25 32,32" fill="#10b981" opacity="0.7" />

  <!-- Center Harmonic Star Point -->
  <circle cx="32" cy="32" r="2.2" fill="#ffffff" filter="url(#glow)" />
</svg>
